mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map super+left click ungrabbed mouse_handle_click selection link prompt

window_margin_width 0
window_padding_width 4

background            #202020
foreground            #d0d0d0
cursor                #d0d0d0
selection_background  #c0c0c0
color0                #151515
color8                #505050
color1                #ac4142
color9                #ac4142
color2                #7e8d50
color10               #7e8d50
color3                #e5b566
color11               #e5b566
color4                #6c99ba
color12               #6c99ba
color5                #9e4e85
color13               #9e4e85
color6                #7dd5cf
color14               #7dd5cf
color7                #d0d0d0
color15               #f5f5f5
selection_foreground  #202020

shell /bin/zsh
editor /opt/homebrew/bin/nvim
# clipboard_control write-primary write-clipboard no-append
clipboard_control write-clipboard write-primary read-clipboard read-primary

term xterm-256color

macos_titlebar_color dark
macos_option_as_alt both
macos_quit_when_last_window_closed yes

font_size 11.0
# font_family FiraCode Nerd Font Mono
font_family      family="Maple Mono NF CN"
# font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_features MapleMono-NF-CN-Regular +zero
font_features MapleMono-NF-CN-Italic +zero +cv35

cursor_trail 10
